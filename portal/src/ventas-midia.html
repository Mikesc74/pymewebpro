<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Today | PymeWebPro Sales</title>
<style>
*{box-sizing:border-box}
:root{--paper:#F2E9D5;--paper2:#E8DFC8;--card:#FBF7EC;--ink:#1A1612;--ink2:#3A2F26;--mute:rgba(26,22,18,.5);--line:rgba(26,22,18,.14);--accent:#D24A1D;--accent2:#A8381A;--green:#166534;--amber:#92400E;--red:#991B1B}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:'Inter Tight',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.5;background-image:radial-gradient(rgba(26,22,18,.05) 1px,transparent 1px);background-size:3px 3px}
.topbar{position:sticky;top:0;z-index:30;background:var(--ink);color:var(--paper);display:flex;align-items:center;gap:1rem;padding:.7rem 1.4rem;border-bottom:3px double rgba(242,233,213,.2)}
.topbar .brand{font-weight:800;font-size:1.05rem}
.topbar .brand em{font-style:italic;font-weight:500;color:var(--accent)}
.topbar .brand b{font-weight:500;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:rgba(242,233,213,.5);margin-left:.5rem}
.topbar .sp{flex:1}
.topbar a,.topbar button.link{color:rgba(242,233,213,.75);text-decoration:none;font-size:.8rem;background:none;border:none;cursor:pointer;font-family:inherit}
.topbar a:hover,.topbar button.link:hover{color:#F2896A}
.topbar .add{background:var(--accent);color:#fff;border:none;border-radius:7px;padding:.45rem .9rem;font-weight:600;font-size:.82rem;cursor:pointer;font-family:inherit}
.topbar .search{background:rgba(242,233,213,.12);border:1px solid rgba(242,233,213,.28);color:var(--paper);border-radius:7px;padding:.42rem .7rem;font:inherit;font-size:.85rem;min-width:220px;margin-left:1rem}
.topbar .search::placeholder{color:rgba(242,233,213,.55)}
.topbar .search:focus{outline:none;border-color:var(--accent)}
.topbar .owner-filter{background:rgba(242,233,213,.12);border:1px solid rgba(242,233,213,.28);color:var(--paper);border-radius:7px;padding:.42rem .6rem;font:inherit;font-size:.82rem;cursor:pointer}
.topbar .owner-filter:focus{outline:none;border-color:var(--accent)}
.topbar .owner-filter option{color:var(--ink)}
@media(max-width:680px){.topbar .search{min-width:130px;margin-left:.5rem}}
.wrap{max-width:1680px;margin:0 auto;padding:1.5rem 1.4rem 5rem}
.intro{color:var(--ink2);margin:.2rem 0 1.4rem;font-size:.95rem}
/* `align-items: stretch` (the flex default) makes every column the same
   height as the tallest one, so short columns still receive drops where the
   user's cursor lands · without it a column with 2 cards stopped 1000px
   above where a 20-card column's bottom was. min-height also guarantees a
   sensible drop zone when ALL columns are short. */
.cols{display:flex;gap:.6rem;padding-bottom:.6rem;align-items:stretch}
.col{flex:1 1 0;min-width:0;min-height:60vh;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.7rem .55rem}
.col.drop-hot{border-color:var(--accent);box-shadow:0 0 0 2px rgba(210,74,29,.28)}
.col h2{font-family:Georgia,'Times New Roman',serif;font-size:1.15rem;margin:0 0 .2rem;display:flex;align-items:center;gap:.5rem}
.col .sub{color:var(--mute);font-size:.8rem;margin:0 0 .9rem}
.col .count{background:var(--accent);color:#fff;border-radius:999px;font-size:.72rem;padding:.1rem .5rem;font-weight:700}
.card{position:relative;display:flex;flex-direction:column;gap:.34rem;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.5rem .6rem;margin:0 0 .5rem;box-shadow:0 1px 0 rgba(26,22,18,.03);overflow:hidden;overflow-wrap:break-word;cursor:pointer}
.card .card-tags{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.card .card-tags .pill{margin-left:0}
.card .tag{display:inline-block;font-size:.64rem;font-weight:700;letter-spacing:.03em;padding:.1rem .42rem;border-radius:999px;background:rgba(26,22,18,.05);border:1px solid var(--line);color:var(--ink2)}
.card .card-del{position:absolute;top:.18rem;left:.22rem;width:1.15rem;height:1.15rem;line-height:1;padding:0;border:0;border-radius:50%;background:transparent;color:var(--mute);font-size:1rem;font-weight:700;cursor:pointer;opacity:0;transition:opacity .12s,background .12s,color .12s;z-index:3}
/* Owner badge · always visible, top-right. Identity is carried by the TEXT
   (first name + initials), never by colour alone. The colour tint is decorative
   only, so this stays readable for red-green colour blindness. */
.card .owner-badge{position:absolute;top:.28rem;right:.34rem;display:inline-flex;align-items:center;gap:.28rem;max-width:62%;padding:.12rem .42rem .12rem .14rem;border-radius:999px;background:rgba(210,74,29,.12);border:1px solid rgba(210,74,29,.28);font-size:.66rem;font-weight:700;line-height:1;color:var(--ink);z-index:2}
.card .owner-badge .ob-ini{display:inline-flex;align-items:center;justify-content:center;min-width:1.05rem;height:1.05rem;padding:0 .15rem;border-radius:50%;background:var(--accent);color:#fff;font-size:.6rem;font-weight:800}
.card .owner-badge .ob-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .owner-badge.unassigned{background:rgba(26,22,18,.05);border-color:rgba(26,22,18,.18);border-style:dashed;color:var(--mute);font-weight:600}
.card .owner-badge.unassigned .ob-ini{background:rgba(26,22,18,.28)}
.card .biz{padding-right:4.4rem}
.card:hover .card-del{opacity:.7}
.card .card-del:hover{opacity:1;background:#c0392b;color:#fff}
.card .card-del:focus-visible{opacity:1;outline:2px solid #c0392b;outline-offset:1px}
.act.act-del{padding:.18rem .5rem;line-height:1;color:#c0392b;border-color:#e8c5be;background:#fff}
.act.act-del:hover{background:#c0392b;color:#fff;border-color:#c0392b}
.card:hover{border-color:var(--accent)}
.card .biz,.card .meta,.card .cmini{overflow-wrap:break-word;max-width:100%}
.card .biz{color:var(--ink)}
.card .cardchip{margin:0}
.card .cmini{font-size:.72rem;color:var(--mute);margin:0}
.card .biz{font-weight:700;font-size:.88rem;margin:0;line-height:1.3}
.card .meta{color:var(--mute);font-size:.73rem;margin:0}
.card .why{font-size:.85rem;color:var(--ink2);background:rgba(210,74,29,.06);border-left:3px solid var(--accent);padding:.4rem .6rem;border-radius:4px;margin:0 0 .7rem}
.contact{display:flex;flex-wrap:wrap;gap:.45rem;align-items:center;margin:0 0 .8rem}
.ci{display:inline-flex;align-items:center;gap:.32rem;font-size:.82rem;color:var(--accent2);text-decoration:none;border:1px solid var(--line);border-radius:7px;padding:.35rem .65rem;background:#fff;white-space:nowrap;line-height:1}
.ci .ci-ic{font-size:.95rem;line-height:1}
.ci:hover{border-color:var(--accent)}
.ci.call{font-weight:700}
.ci.none{color:var(--mute);border-style:dashed;cursor:default;background:transparent}
.pill{display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.04em;padding:.12rem .45rem;border-radius:999px;margin-left:.4rem;vertical-align:middle}
.pill.HOT{background:rgba(153,27,27,.14);color:var(--red)}
.pill.WARM{background:rgba(146,64,14,.14);color:var(--amber)}
.pill.COOL,.pill.COLD,.pill.DEAD{background:rgba(26,22,18,.08);color:var(--mute)}
.row{display:flex;flex-wrap:wrap;gap:.4rem}
button.act{font-family:inherit;font-size:.8rem;font-weight:600;border-radius:7px;padding:.45rem .7rem;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink)}
button.act:hover{border-color:var(--accent);color:var(--accent2)}
button.act.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button.act.primary:hover{background:var(--accent2);color:#fff}
button.act.ghost{background:transparent;color:var(--mute)}
button.act.danger{color:#c0392b;border-color:#e8c5be}
button.act.danger:hover{background:#c0392b;color:#fff;border-color:#c0392b}
.empty{color:var(--mute);font-size:.85rem;text-align:center;padding:1.6rem .5rem;border:1px dashed var(--line);border-radius:10px}
.nn-wrap{margin:1.6rem 0 0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.1rem 1.3rem}
.nn-wrap h2{font-family:Georgia,serif;font-size:1.1rem;margin:0 0 .2rem;display:flex;align-items:center;gap:.5rem}
.nn-wrap .count{background:var(--accent);color:#fff;border-radius:999px;font-size:.72rem;padding:.1rem .5rem;font-weight:700}
.nn-wrap .sub{color:var(--mute);font-size:.8rem;margin:0 0 .9rem}
.nn-row{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.55rem 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.nn-row:last-child{border-bottom:none}
.nn-biz{font-weight:600;font-size:.92rem}
.nn-meta{color:var(--mute);font-weight:400;font-size:.82rem}
.nn-act{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}
.funnel{display:flex;align-items:stretch;gap:.3rem;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.7rem .9rem;margin:0 0 1.3rem;overflow-x:auto}
.funnel .fstep{flex:1;min-width:88px;text-align:center}
.funnel .fn{font-size:1.5rem;font-weight:800;line-height:1}
.funnel .fl{font-size:.7rem;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;margin-top:.25rem}
.funnel .farr{align-self:center;color:var(--line);font-size:1.3rem;flex:none}
.card .track{font-size:.76rem;color:var(--mute);margin:0 0 .6rem}
/* lead detail · chip row + section labels */
.d-chips{display:flex;flex-wrap:wrap;gap:.35rem;margin:0 0 .6rem}
.d-chip{display:inline-flex;align-items:center;gap:.28rem;font-size:.72rem;font-weight:700;letter-spacing:.02em;padding:.22rem .55rem;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink2)}
.d-chip .d-ic{font-size:.85rem;line-height:1}
.d-chip.stage-contact{background:#fff;color:var(--ink2)}
.d-chip.stage-follow{background:#FFF4E5;color:#92400E;border-color:#F2D2A5}
.d-chip.stage-mockup{background:#E6F0FA;color:#1F4E79;border-color:#BDD5EC}
.d-chip.stage-proposal{background:#EAF3E6;color:#1F5B2A;border-color:#BFD9B0}
.d-chip.stage-close{background:#FFE9DF;color:#A8381A;border-color:#F2BFA9}
.d-chip.stage-won{background:#DDEFD6;color:#1F5B2A;border-color:#A6D49A}
.d-chip.stage-lost{background:#EEE;color:var(--mute);border-color:var(--line)}
.d-chip.heat-HOT{background:rgba(153,27,27,.1);color:var(--red);border-color:rgba(153,27,27,.3)}
.d-chip.heat-WARM{background:rgba(146,64,14,.1);color:var(--amber);border-color:rgba(146,64,14,.3)}
.d-chip.heat-COOL,.d-chip.heat-COLD,.d-chip.heat-DEAD{color:var(--mute)}
.d-chip.alert{background:rgba(153,27,27,.08);color:var(--red);border-color:rgba(153,27,27,.4)}
.d-meta{font-size:.82rem;color:var(--mute);margin:0 0 .8rem}
.d-next{font-size:.92rem;margin:.4rem 0 .8rem;background:var(--paper2);border-radius:8px;padding:.55rem .75rem;display:flex;align-items:center;gap:.4rem}
.d-next .d-nx-lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);font-weight:700}
.d-next b{color:var(--ink)}
.d-owner{font-size:.9rem;margin:0 0 .8rem;background:var(--paper2);border-radius:8px;padding:.5rem .75rem;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.d-owner .d-ow-lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);font-weight:700}
.d-owner b{color:var(--ink)}
.d-owner .d-ow-unassigned{color:var(--mute);font-style:italic}
.d-owner select{font:inherit;padding:.32rem .5rem;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
.d-mock{font-size:.84rem;margin:.6rem 0;display:flex;flex-wrap:wrap;align-items:center;gap:.5rem}
.d-mock .d-mlbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--mute)}
.d-mock a{color:var(--accent2);word-break:break-all;flex:1;min-width:0}
.d-mock button.act{flex:none;padding:.25rem .6rem}
.d-lang{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;margin:.2rem 0 .4rem}
.d-lang button.act{flex:none;padding:.3rem .7rem}
.d-pitch-toggle{font-size:.78rem;color:var(--mute);background:none;border:none;padding:.2rem 0;cursor:pointer;text-decoration:underline;font-family:inherit}
.d-pitch-toggle:hover{color:var(--accent)}
.d-pitch{font-size:.85rem;color:var(--ink2);background:rgba(210,74,29,.06);border-left:3px solid var(--accent);padding:.5rem .7rem;border-radius:4px;margin:.3rem 0 .8rem}
.img-row{display:flex;align-items:center;gap:.8rem;padding:.55rem 0;border-bottom:1px solid var(--line)}
.img-row:last-child{border-bottom:none}
.img-prev{width:92px;height:60px;object-fit:cover;border-radius:6px;background:var(--paper2);border:1px solid var(--line);flex:none}
.img-meta{flex:1}
.img-meta b{display:block;font-size:.9rem}
.img-meta span{font-size:.7rem;color:var(--mute)}
.img-meta .img-err{display:block;color:var(--red);font-size:.68rem;word-break:break-word;margin-top:.2rem}
.np-opts{display:flex;flex-direction:column;gap:.35rem;margin:.5rem 0 .8rem}
.np-opt{display:flex;align-items:center;gap:.5rem;font-size:.9rem}
.np-px{margin-left:auto;color:var(--mute)}
.tl-head-row{display:flex;align-items:center;gap:.5rem;margin:1rem 0 .4rem}
.tl-title{margin:0;font-size:.95rem;flex:1;font-weight:700}
.tl-item{border-left:2px solid var(--line);padding:.1rem 0 .7rem .8rem}
.tl-head{display:flex;justify-content:space-between;gap:.5rem;align-items:baseline}
.tl-kind{font-weight:600;font-size:.82rem}
.tl-by{margin-left:.4rem;color:var(--mute);font-size:.78rem;font-weight:400}
.tl-when{font-size:.74rem;color:var(--mute)}
.tl-del{background:none;border:none;color:var(--mute);cursor:pointer;font-size:1rem;line-height:1;margin-left:.4rem;padding:0}
.tl-del:hover{color:var(--red)}
.tl-body{font-size:.82rem;color:var(--ink2);margin-top:.2rem;white-space:pre-wrap}
.badge-hot{display:inline-block;margin-left:.45rem;font-size:.6rem;font-weight:800;letter-spacing:.05em;background:var(--ink);color:#fff;border:1px solid var(--accent);border-radius:999px;padding:.12rem .45rem;vertical-align:middle}
.alert{background:var(--ink);color:var(--paper);border-radius:12px;padding:.75rem 1.1rem;margin:0 0 1rem;font-weight:600;display:flex;gap:.5rem;align-items:center}
.alert b{color:#F2896A}
.loading{text-align:center;color:var(--mute);padding:4rem}
.modal-bg{position:fixed;inset:0;background:rgba(26,22,18,.45);display:flex;align-items:flex-start;justify-content:center;z-index:100;padding:1rem;overflow-y:auto}
.modal{background:var(--paper);border-radius:14px;max-width:540px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden;display:flex;flex-direction:column;max-height:calc(100vh - 2rem);margin:auto 0}
.modal .mh{background:var(--ink);color:var(--paper);padding:.8rem 1.1rem;display:flex;align-items:center;justify-content:space-between;flex:none}
.modal .mh h3{margin:0;font-size:1rem}
.modal .mh button{background:none;border:none;color:rgba(242,233,213,.7);font-size:1.3rem;cursor:pointer;line-height:1}
.modal .mb{padding:1.1rem;overflow-y:auto;flex:1 1 auto;min-height:0}
.modal textarea{width:100%;min-height:170px;font:inherit;font-size:.92rem;padding:.7rem;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);resize:vertical}
.modal .note{font-size:.78rem;color:var(--mute);margin:.5rem 0 0}
.modal .mf{display:flex;gap:.5rem;justify-content:flex-end;padding:.9rem 1.1rem;border-top:1px solid var(--line);flex-wrap:wrap;flex:none;background:var(--paper)}
.modal .field{margin:0 0 .7rem}
.modal label{display:block;font-size:.78rem;color:var(--mute);margin:0 0 .25rem;text-transform:uppercase;letter-spacing:.04em}
.modal input,.modal select{width:100%;font:inherit;padding:.5rem .6rem;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink)}
#toast{position:fixed;left:50%;bottom:1.5rem;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:.6rem 1.1rem;border-radius:8px;font-size:.85rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:200}
#toast.show{opacity:1}
#toast.err{background:var(--red)}
.col h2{font-size:1rem}
.card[draggable=true]{cursor:grab}
.card.dragging{opacity:.45}
.card.alert{border:1px solid var(--red);border-left:4px solid var(--red);background:#E08A7A}
.card.alert .biz,.card.alert .meta,.card.alert .cmini{color:var(--ink)}
.wmark{font-weight:800}
.card.viewed{border:1px solid #1f4e79;border-left:4px solid #1f4e79;background:#cfe0f5}
.card.viewed .biz,.card.viewed .meta,.card.viewed .cmini{color:var(--ink)}
.chip.view{color:#1f4e79;background:rgba(31,78,121,.14)}
/* Mockup v2 card states · colour + shape + label for colour-blind safety. */
.card.mock-generating{border:1px solid var(--accent);border-left:4px solid var(--accent);background:#FFE9DF;animation:mockPulse 1.6s ease-in-out infinite}
.card.mock-generating .biz,.card.mock-generating .meta,.card.mock-generating .cmini{color:var(--ink)}
.card.mock-ready{border:1px solid #1F5B2A;border-left:4px solid #1F5B2A;background:#DDEFD6}
.card.mock-ready .biz,.card.mock-ready .meta,.card.mock-ready .cmini{color:var(--ink)}
.card.mock-review{border:1px solid #92400E;border-left:4px solid #92400E;background:#FFF4E5}
.card.mock-review .biz,.card.mock-review .meta,.card.mock-review .cmini{color:var(--ink)}
.chip.mock-ready{color:#1F5B2A;background:rgba(31,91,42,.14)}
.chip.mock-review{color:#92400E;background:rgba(146,64,14,.14)}
.chip.mock-generating{color:var(--accent2);background:rgba(210,74,29,.14)}
@keyframes mockPulse{0%,100%{box-shadow:0 0 0 0 rgba(210,74,29,.45)}50%{box-shadow:0 0 0 6px rgba(210,74,29,.05)}}
.card.wait{opacity:.82}
.chip{display:inline-flex;align-items:center;gap:.22rem;font-size:.64rem;font-weight:800;letter-spacing:.03em;padding:.12rem .45rem;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.chip.alert{color:var(--red);background:rgba(153,27,27,.08)}
.chip.wait{color:var(--mute);background:rgba(26,22,18,.05);border-style:dashed}
.chip.won{color:var(--green);background:rgba(22,101,52,.1)}
.chip.lost{color:var(--mute);background:rgba(26,22,18,.07)}
/* Multi-select pain-reason picker · two-column checkbox grid that lives
   inline in the lead-detail modal so it's always visible and 1-click. */
.pain-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.32rem .8rem;padding:.6rem .8rem;background:rgba(210,74,29,.06);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;margin:0 0 .8rem}
.pain-grid .pain-hdr{grid-column:1 / -1;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);font-weight:700;margin:0 0 .15rem;display:flex;align-items:center;justify-content:space-between}
.pain-grid .pain-hdr .pain-cnt{font-size:.7rem;color:var(--accent2);font-weight:700;letter-spacing:0;text-transform:none}
.pain-grid label{display:flex;align-items:center;gap:.42rem;font-size:.85rem;color:var(--ink2);cursor:pointer;margin:0;padding:.15rem 0}
.pain-grid label:hover{color:var(--ink)}
.pain-grid input[type=checkbox]{width:auto;margin:0;flex:none}
@media(max-width:480px){.pain-grid{grid-template-columns:1fr}}
/* Manual image upload zone for the lead-detail modal · drag-and-drop +
   click-to-browse. Pairs with the carousel; lets Mike/Santi paste IG
   screenshots when the scraper fails. */
.upbox{background:var(--paper2);border-radius:8px;padding:.6rem .8rem;margin:0 0 .8rem}
.upbox-hdr{display:flex;align-items:center;gap:.5rem;margin:0 0 .4rem}
.upbox-hdr .upbox-lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);font-weight:700;flex:1}
.upbox-hdr .upbox-count{font-size:.7rem;color:var(--accent2);font-weight:700}
.updrop{border:2px dashed var(--line);border-radius:8px;padding:.7rem;background:#fff;text-align:center;color:var(--mute);font-size:.85rem;cursor:pointer;transition:border-color .15s,background .15s}
.updrop:hover,.updrop.dragover{border-color:var(--accent);background:#FFE9DF;color:var(--accent2)}
.upgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:.4rem;margin-top:.5rem}
.upgrid .upthumb{position:relative;padding-top:100%;border-radius:6px;background:#E8DFC8 center/cover no-repeat;border:1px solid var(--line)}
.upgrid .upthumb .upx{position:absolute;top:.15rem;right:.15rem;width:18px;height:18px;border-radius:50%;border:0;background:rgba(26,22,18,.7);color:#fff;font-size:.7rem;line-height:1;padding:0;cursor:pointer;opacity:0;transition:opacity .15s}
.upgrid .upthumb:hover .upx{opacity:1}
.upgrid .upthumb .upx:hover{background:var(--red)}

.team-sub{color:var(--ink2);font-size:.9rem;margin:0 0 1rem}

.team-form .tf-cancel:hover{background:var(--paper2,#E8DFC8)}
</style>

<body>
<div class="topbar">
  <span class="brand">Pyme<em>WebPro</em><b>Today</b></span>
  <input id="search" class="search" type="search" placeholder="Search leads..." autocomplete="off">
  <select id="owner-filter" class="owner-filter" aria-label="Filter by owner">
    <option value="">All owners</option>
    <option value="santi">Santiago</option>
    <option value="cristian">Cristian</option>
    <option value="camila">Camila</option>
    <option value="mike">Mike</option>
    <option value="__none__">Unassigned</option>
  </select>
  <span class="sp"></span>
  <a href="/recursos" target="_blank" rel="noopener" style="text-transform:uppercase;letter-spacing:.04em;font-weight:600">Sales manual</a>
  <a href="#" id="btn-team" style="text-transform:uppercase;letter-spacing:.04em;font-weight:600">Team</a>
  <button class="add" id="btn-add">+ Add prospect</button>
</div>
<div class="wrap">
  <p class="intro">Drag each card left to right as the prospect advances. <b>Red + ⚠</b> means you need to act now. AI drafts the messages (in Spanish), you review and send.</p>
  <div id="app"><div class="loading">Loading your day...</div></div>
</div>
<div id="modal-root"></div>
<div id="team-overlay" hidden></div>
<div id="toast"></div>
<script>
"use strict";
var CAL_LINK = "https://cal.com/medellinguide/intro"; // TODO: switch to Santi's Cal when he has one
var DEPOSITO = "$120.000 COP (30%)";
var DEMO_BASE = "https://mockups.pymewebpro.com";
var LEADS = [], CADENCE = [], BY_ID = {}, ACTS_BY_LEAD = {}, SEARCH = '', DEALS_BY_LEAD = {};
var OWNER_FILTER = '';   // '' = all, '__none__' = unassigned, else a handle
var IS_ADMIN = false, ME_HANDLE = '';   // set once from /api/admin/crm/whoami
// Sales roster · DB-driven from the salespeople table (GET /api/admin/crm/
// salespeople). ROSTER is the raw array of rows; ROSTER_BY is a handle -> row
// map. Only admins may reassign owners or edit the roster. Loaded once on
// startup by loadRoster(). The legacy 'santiago' alias maps to 'santi'.
var ROSTER = [], ROSTER_BY = {};
function _ownerKey(o){ var s=String(o==null?'':o).toLowerCase().trim(); if(s==='santiago') return 'santi'; return s; }
async function loadRoster(){
  try {
    var r = await api('/api/admin/crm/salespeople');
    ROSTER = (r && r.rows) || [];
  } catch(e){ ROSTER = []; }
  ROSTER_BY = {};
  ROSTER.forEach(function(row){ if(row && row.handle) ROSTER_BY[row.handle] = row; });
}
function salesName(o){ var k=_ownerKey(o); if(!k||k==='system'||k==='ai') return ''; if(ROSTER_BY[k] && ROSTER_BY[k].full_name) return ROSTER_BY[k].full_name; return k.charAt(0).toUpperCase()+k.slice(1); }
function salesFirst(o){ var k=_ownerKey(o); if(!k||k==='system'||k==='ai') return ''; if(ROSTER_BY[k] && (ROSTER_BY[k].first_name || ROSTER_BY[k].full_name)) return ROSTER_BY[k].first_name || String(ROSTER_BY[k].full_name).split(/\s+/)[0]; return k.charAt(0).toUpperCase()+k.slice(1); }
function salesInitials(o){ var n=salesName(o); if(!n) return ''; var parts=n.split(/\s+/).filter(Boolean); if(parts.length>=2) return (parts[0].charAt(0)+parts[1].charAt(0)).toUpperCase(); return n.slice(0,2).toUpperCase(); }
// No à la carte add-ons anymore (2026-05-25). The page is one fixed price
// ($400.000) and the extras (showcase, catalog, bilingual, 24/7 assistant) live
// inside the monthly plans, not in the one-time proposal. Kept as an empty
// array so the proposal builder still works (base-only quote).
var ADDONS = [];
// Pain reasons · the "why this prospect needs PymeWebPro" set. Codes here
// MUST match the keys in PAIN_HINTS inside portal/src/outreach.js so the
// front-end selection drives the AI's draft.
var PAIN_REASONS = [
  {k:'no_site',        l:'No website'},
  {k:'old_site',       l:'Outdated website'},
  {k:'broken_site',    l:'Broken / errors on site'},
  {k:'not_mobile',     l:'Not mobile-friendly'},
  {k:'slow_site',      l:'Very slow site'},
  {k:'no_whatsapp',    l:'No WhatsApp button on site'},
  {k:'no_products',    l:'Site doesn\'t show products / menu'},
  {k:'no_seo',         l:'Invisible on Google'},
  {k:'social_only',    l:'Only on social (IG / FB)'},
  {k:'competitor_has', l:'Competitors have a real site'},
];
function painLabel(k){ for(var i=0;i<PAIN_REASONS.length;i++){ if(PAIN_REASONS[i].k===k) return PAIN_REASONS[i].l; } return ''; }
// pain_reason is stored as a comma-joined list of codes (backwards-compat
// with the original single-code values · "no_site" parses as ["no_site"]).
// Use these two helpers as the source of truth on the front-end.
function getPainList(lead){ var s=lead && lead.pain_reason; return s ? String(s).split(',').map(function(x){return x.trim();}).filter(Boolean) : []; }
function joinPainList(arr){ var seen={}, out=[]; (arr||[]).forEach(function(c){ if(c && !seen[c]){ seen[c]=1; out.push(c); } }); return out.length ? out.join(',') : null; }

// Stale prices that may appear in older suggested_pitch / AI-drafted notes.
// Used to hide pitches that quote the wrong price (was $390k / $117k / $273k
// before 2026-05; now $400k flat plus monthly plans).
var STALE_PRICE_RE = /\$\s*3(?:90|9\.000|90\.000|9)k?|\$\s*117(?:\.000)?k?|\$\s*273(?:\.000)?k?/i;

function el(html){ var d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstElementChild; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function digits(s){ s=String(s||''); var o=''; for(var i=0;i<s.length;i++){var c=s[i]; if(c>='0'&&c<='9')o+=c;} return o; }
function formatCop(n){ n=Math.round(Number(n)||0); var s=String(n),o='',c=0; for(var i=s.length-1;i>=0;i--){o=s[i]+o; if(++c%3===0&&i>0)o='.'+o;} return o; }
function formatPhone(s){
  // Display a +57 3XX XXX XXXX style for Colombian mobile numbers; otherwise
  // group in 3s. Improves readability of the Call button.
  var d = digits(s); if(!d) return '';
  if(d.length===12 && d.indexOf('57')===0){ d=d.slice(2); return '+57 '+d.slice(0,3)+' '+d.slice(3,6)+' '+d.slice(6); }
  if(d.length===10){ return d.slice(0,3)+' '+d.slice(3,6)+' '+d.slice(6); }
  return '+'+d;
}
function waNum(l){ return digits(l.whatsapp||l.phone||''); }
// Always surface SOME identifier: business name, contact name, IG handle,
// email, or site domain. Many legacy form/checkout leads have no business_name.
function leadName(l){
  if(l.business_name) return l.business_name;
  if(l.name) return l.name;
  if(l.instagram) return '@'+String(l.instagram).replace(/^@+/,'');
  if(l.email) return l.email;
  if(l.current_site) return String(l.current_site).replace(/^https?:\/\//,'').replace(/\/.*$/,'');
  return 'Unnamed';
}
function toast(m,err){ var t=document.getElementById('toast'); t.textContent=m; t.className=err?'show err':'show'; clearTimeout(toast._t); toast._t=setTimeout(function(){t.className='';},2600); }

async function api(path, opts){
  opts = opts||{};
  opts.credentials = 'same-origin';
  opts.headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  var r = await fetch(path, opts);
  var data = {}; try{ data = await r.json(); }catch(e){}
  if(!r.ok) throw new Error(data.error || ('HTTP '+r.status));
  return data;
}

var _whoamiDone = false;
async function loadWhoami(){
  if(_whoamiDone) return;
  _whoamiDone = true;
  try { var w = await api('/api/admin/crm/whoami'); IS_ADMIN = !!(w && w.is_admin); ME_HANDLE = (w && w.handle) || ''; }
  catch(e){ IS_ADMIN = false; ME_HANDLE = ''; }
}

async function loadAll(){
  await loadWhoami();
  await loadRoster();
  var grid;
  try {
    grid = await api('/api/admin/crm/grid');
    LEADS = (grid && grid.leads) || [];
  } catch(e){
    document.getElementById('app').innerHTML = '<div class="empty">Could not load data. Reload the page. ('+esc(e.message)+')</div>';
    return;
  }
  try { var c = await api('/api/admin/outreach/cadence'); CADENCE = (c && c.buckets) || []; } catch(e){ CADENCE = []; }
  BY_ID = {}; LEADS.forEach(function(l){ BY_ID[l.id]=l; });
  ACTS_BY_LEAD = {};
  (((grid && grid.activities) || [])).forEach(function(a){ if(!a.lead_id) return; (ACTS_BY_LEAD[a.lead_id] = ACTS_BY_LEAD[a.lead_id] || []).push(a); });
  DEALS_BY_LEAD = {};
  (((grid && grid.deals) || [])).forEach(function(d){ if(!d.lead_id) return; var ex=DEALS_BY_LEAD[d.lead_id]; if(!ex || (d.updated_at||d.created_at||0) > (ex.updated_at||ex.created_at||0)) DEALS_BY_LEAD[d.lead_id]=d; });
  render();
}

// ---- stage model: lead_stage IS the source of truth (matches the CRM funnel).
// Legacy `status='converted'` only counts as Won when the lead is also
// sales_qualified (the real win combo); otherwise it is ignored.
function isWon(l){ return l.lead_stage==='sales_qualified' && l.status==='converted'; }
function isLost(l){ return l.lead_stage==='disqualified'; }
function isClosed(l){ return isWon(l) || isLost(l); }
function isActive(l){ return !isClosed(l); }
function isNew(l){ var s=l.lead_stage; return !isClosed(l) && (!s || s==='new' || s==='raw') && !l.last_touched_at; }
function inContact(l){ return isNew(l) && !!waNum(l); }
function inNoNum(l){ return isNew(l) && !waNum(l); }
function inMockup(l){ return !isClosed(l) && l.lead_stage==='mockup'; }
function inProposal(l){ return !isClosed(l) && l.lead_stage==='proposal'; }
function inClose(l){ return !isClosed(l) && l.lead_stage==='sales_qualified'; }
function inFollow(l){
  if(isClosed(l)) return false;
  var s=l.lead_stage;
  if(s==='contacted' || s==='marketing_qualified') return true;
  if((!s || s==='new' || s==='raw') && l.last_touched_at) return true; // legacy: messaged, stage never advanced
  return false;
}
function matchSearch(l){
  if(!SEARCH) return true;
  var q = SEARCH.toLowerCase();
  var hay = [l.business_name,l.name,l.category,l.city,l.email,l.instagram,l.whatsapp,l.phone,l.current_site,l.owner,salesName(l.owner)].filter(Boolean).join(' ').toLowerCase();
  return hay.indexOf(q) !== -1;
}
function matchOwner(l){
  if(!OWNER_FILTER) return true;
  var o = _ownerKey(l.owner);
  if(OWNER_FILTER === '__none__') return !o || o==='system' || o==='ai';
  return o === OWNER_FILTER;
}
function colOf(l){
  if(isClosed(l)) return 'closed';
  if(inContact(l)) return 'contact';
  if(inNoNum(l)) return 'nonum';
  if(inMockup(l)) return 'mockup';
  if(inProposal(l)) return 'proposal';
  if(inClose(l)) return 'close';
  if(inFollow(l)) return 'followup';
  return 'followup';
}

// which leads the cadence engine says are due for a nudge
var DUE = {};
function recomputeDue(){ DUE={}; (CADENCE||[]).forEach(function(b){ (b.leads||[]).forEach(function(x){ if(x&&x.id) DUE[x.id]=b.bucket; }); }); }
function daysSince(l){ return l.last_touched_at ? Math.floor((Date.now()-l.last_touched_at)/86400000) : 999; }

// attention signal per column: returns a short label or null (red + label)
function alertFor(l, col){
  if(col==='followup') return DUE[l.id] ? 'Follow up now' : null;
  if(col==='mockup')   return mockupReady(l) ? 'Ready to send' : null;
  if(col==='proposal') return proposalReady(l) ? 'Ready to send' : null;
  if(col==='close')    return daysSince(l)>=3 ? 'No reply, push' : null;
  return null;
}

// stage drag targets: column -> patch payload
function stageForDrop(col){
  if(col==='followup') return {lead_stage:'contacted'};
  if(col==='mockup')   return {lead_stage:'mockup'};
  if(col==='proposal') return {lead_stage:'proposal'};
  if(col==='close')    return {lead_stage:'sales_qualified'};
  if(col==='closed')   return {lead_stage:'disqualified'};
  return null; // contact / nonum are not drop targets
}
var COL_TITLE = {contact:'To contact', nonum:'Need phone', followup:'Follow-up', mockup:'Mockup', proposal:'Pago', close:'Closing', closed:'Closed'};
async function moveTo(id, col){
  var lead = BY_ID[id]; if(!lead) return;
  if(colOf(lead)===col) return;
  var patch = stageForDrop(col); if(!patch) return;
  try{
    await api('/api/admin/crm/leads/'+lead.id, {method:'PATCH', body: JSON.stringify(patch)});
    lead.lead_stage = patch.lead_stage;
    toast('Moved to '+(COL_TITLE[col]||col));
    render();
    // Moving into Mockup or Proposal opens a setup popup that asks for
    // details, then generates. Nothing generates just by sitting in a stage.
    if(col==='mockup') openMockupSetup(lead);
    else if(col==='proposal') sendPaymentPage(lead);
  }catch(err){ toast('Error: '+err.message, true); }
}

// Helper: only close a modal on backdrop click if the mousedown ALSO started
// on the backdrop. Prevents accidental closes when the user starts a click
// inside the modal (selecting text in an input, etc.) and mouseup lands on
// the backdrop. Symptom this fixes: "I was typing and the text disappeared"
// because the modal closed mid-edit.
function wireBgClose(bg, onClose){
  var down = false;
  bg.addEventListener('mousedown', function(e){ down = (e.target === bg); });
  bg.addEventListener('click', function(e){ if(e.target === bg && down && typeof onClose === 'function') onClose(); down = false; });
}

// Setup popup shown when a card enters the Mockup stage: pick the language
// variant, then generate the example + its WhatsApp message.
function openMockupSetup(lead){
  closePanel();
  var isDental = /odonto|dental|dentist/i.test(String(lead.category||''));
  var pick = lead.demo_lang==='en' ? 'en' : 'es';
  var bg = el('<div class="modal-bg"><div class="modal"><div class="mh"><h3>Prepare mockup · '+esc(leadName(lead))+'</h3><button data-x="close">&times;</button></div>'
    + '<div class="mb">'
    + '<p class="note">Detected type: <b>'+(isDental?'Dental / odontology':'General business')+'</b> (the template is picked from the lead\'s sector).</p>'
    + '<div class="field"><label>Mockup language</label><div class="d-lang" style="margin:.2rem 0 0">'
      + '<button type="button" class="act'+(pick==='en'?'':' primary')+'" data-pick="es">Local · Spanish</button>'
      + '<button type="button" class="act'+(pick==='en'?' primary':'')+'" data-pick="en">English (for expats)</button>'
    + '</div></div>'
    + '<p class="note">Le manda al prospecto el enlace del asistente de datos (logo, fotos, visión) y arranca a generar la muestra ya. Revisa el mensaje antes de enviarlo.</p>'
    + '</div>'
    + '<div class="mf"><button class="act ghost" data-x="close">Cancel</button><button class="act primary" data-x="gen">Iniciar muestra</button></div>'
    + '</div></div>');
  wireBgClose(bg, closePanel);
  document.getElementById('modal-root').appendChild(bg);
  bg.querySelectorAll('[data-pick]').forEach(function(b){ b.onclick=function(){ pick=b.getAttribute('data-pick'); bg.querySelectorAll('[data-pick]').forEach(function(x){ x.className='act'+(x.getAttribute('data-pick')===pick?' primary':''); }); }; });
  bg.querySelectorAll('[data-x="close"]').forEach(function(b){ b.onclick=closePanel; });
  bg.querySelector('[data-x="gen"]').onclick = async function(){
    this.disabled=true; this.textContent='Iniciando...';
    try{
      if((lead.demo_lang||'es')!==pick){ await api('/api/admin/crm/leads/'+lead.id, {method:'PATCH', body: JSON.stringify({demo_lang:pick})}); lead.demo_lang=pick; }
      closePanel();
      await prepareMockup(lead);
    }catch(err){ toast('Error: '+err.message, true); this.disabled=false; this.textContent='Iniciar muestra'; }
  };
}

// Entrar a la columna Mockup hace lo mismo en los tres canales (chat / outbound
// / calle): (1) le manda al prospecto el enlace del asistente de datos para
// recoger su visión y assets, y (2) arranca a generar la muestra ya.
async function prepareMockup(lead){
  toast('Iniciando muestra...');
  try{
    var r = await api('/api/admin/cockpit/start-mockup', {method:'POST', body: JSON.stringify({lead_id:lead.id})});
    api('/api/admin/cockpit/mockup-build/'+lead.id, {method:'POST', body: JSON.stringify({})}).catch(function(){});
    await loadAll();
    if(r && r.draft){ showPanel(lead, null, r.draft); }
    toast(r && r.submitted ? 'Asistente ya completado · generación reiniciada' : 'Enlace listo para enviar · generando muestra');
  }catch(err){ toast('No se pudo iniciar la muestra: '+err.message, true); }
}

function heatPill(h){ return h ? '<span class="pill '+esc(h)+'">'+esc(h)+'</span>' : ''; }

// Contact row · three discrete buttons with spacing (call, WhatsApp, IG, site).
// Phone number is shown on its own line under the buttons so the Call button
// stays compact and tappable.
function contactRow(l){
  var wa = waNum(l);
  var bits = [];
  if(wa){
    bits.push('<a class="ci call" href="tel:+'+wa+'" title="'+esc(formatPhone(wa))+'"><span class="ci-ic">📞</span>Call</a>');
    bits.push('<a class="ci" href="https://wa.me/'+wa+'" target="_blank" rel="noopener"><span class="ci-ic">💬</span>WhatsApp</a>');
  } else {
    bits.push('<span class="ci none">No phone yet · use "Add WhatsApp" below</span>');
  }
  if(l.instagram){ var ig = String(l.instagram).replace(/^@+/, ''); bits.push('<a class="ci" href="https://instagram.com/'+esc(ig)+'" target="_blank" rel="noopener"><span class="ci-ic">📷</span>Instagram</a>'); }
  if(l.current_site){ var u = /^https?:\/\//i.test(l.current_site) ? l.current_site : 'https://'+l.current_site; bits.push('<a class="ci" href="'+esc(u)+'" target="_blank" rel="noopener"><span class="ci-ic">🌐</span>Site</a>'); }
  var phoneLine = wa ? '<div style="font-size:.75rem;color:var(--mute);margin:.1rem 0 .5rem">'+esc(formatPhone(wa))+'</div>' : '';
  return '<div class="contact">'+bits.join('')+'</div>'+phoneLine;
}

function touchLine(l){
  var t = l.touches_count||0;
  if(!t && !l.last_touched_at) return 'Not contacted';
  var s = t+' touch'+(t===1?'':'es');
  if(l.last_touched_at){ var d=Math.floor((Date.now()-l.last_touched_at)/86400000); s += ' · last '+(d<=0?'today':d+'d ago'); }
  return s;
}
function nextStep(l){
  if(isWon(l)) return 'Won';
  if(isLost(l)) return 'Lost';
  if(l.lead_stage==='sales_qualified') return daysSince(l)>=3 ? 'Push to close' : 'Close or schedule';
  if(l.lead_stage==='proposal') return l.paid_at ? 'Pagado · publicar' : 'Enviar pago';
  if(l.lead_stage==='mockup') return mockupReady(l) ? 'Ready to send' : (mockOpened(l) ? 'Viewed mockup' : (l.last_touched_at ? 'Sent, awaiting reply' : 'Preparing mockup'));
  if(!l.last_touched_at) return waNum(l) ? 'Contact' : 'Get phone';
  return DUE[l.id] ? 'Follow up' : 'Awaiting reply';
}
// Stage key used to drive the chip color in the detail modal.
function stageKey(l){
  if(isWon(l)) return 'won';
  if(isLost(l)) return 'lost';
  var s = l.lead_stage;
  if(s==='sales_qualified') return 'close';
  if(s==='proposal') return 'proposal';
  if(s==='mockup') return 'mockup';
  if(s==='contacted' || s==='marketing_qualified') return 'follow';
  if(l.last_touched_at) return 'follow';
  return 'contact';
}
function stageLabel(l){
  if(isWon(l)) return 'Won';
  if(isLost(l)) return 'Lost';
  var s = l.lead_stage;
  if(s==='sales_qualified') return 'Closing';
  if(s==='proposal') return 'Pago';
  if(s==='mockup') return 'Mockup';
  if(s==='contacted' || s==='marketing_qualified') return 'In follow-up';
  if(l.last_touched_at) return 'In follow-up';
  return 'Not contacted';
}
function kindLabel(k){ return {'note':'Note / draft','whatsapp':'WhatsApp','email':'Email','call':'Call','meeting':'Meeting','task':'Task'}[k] || k || 'Activity'; }
function ownerLabel(o){ if(!o) return ''; var s=String(o).toLowerCase(); if(s==='mike') return 'Mike'; if(s==='santi'||s==='santiago') return 'Santi'; if(s==='system'||s==='ai') return ''; return s.charAt(0).toUpperCase()+s.slice(1); }
function fmtWhen(ms){ if(!ms) return ''; var d=Math.floor((Date.now()-ms)/86400000); if(d<=0) return 'today'; if(d===1) return 'yesterday'; if(d<30) return d+'d ago'; return new Date(ms).toISOString().slice(0,10); }
function hasDemo(l){ return true; } // every business type has at least the generic template
function mockOpened(l){ var acts=ACTS_BY_LEAD[l.id]||[]; for(var i=0;i<acts.length;i++){ if(acts[i].subject==='Mockup abierto') return acts[i].occurred_at||acts[i].created_at||1; } return 0; }
// The auto-generated mockup message (subject 'Listo: mockup'). Ready = generated
// and not yet sent (its timestamp is newer than the last outbound touch).
function mockupDraft(l){ var acts=ACTS_BY_LEAD[l.id]||[], best=0, body=''; for(var i=0;i<acts.length;i++){ if(acts[i].subject==='Listo: mockup'){ var t=acts[i].occurred_at||acts[i].created_at||0; if(t>=best){best=t;body=acts[i].body||'';} } } return best?{at:best,body:body}:null; }
function mockupReady(l){ var d=mockupDraft(l); return !!d && d.at > (l.last_touched_at||0); }

function funnelStripHTML(){
  var c={contact:0,follow:0,mockup:0,prop:0,close:0,won:0};
  LEADS.forEach(function(l){
    if(isWon(l)){c.won++;return;}
    if(isLost(l))return;
    if(inMockup(l)){c.mockup++;return;}
    if(inProposal(l)){c.prop++;return;}
    if(inClose(l)){c.close++;return;}
    if(inFollow(l)){c.follow++;return;}
    c.contact++;
  });
  function step(lbl,n){return '<div class="fstep"><div class="fn">'+n+'</div><div class="fl">'+lbl+'</div></div>';}
  return '<div class="funnel">'+step('To contact',c.contact)+'<div class="farr">&rsaquo;</div>'+step('Follow-up',c.follow)+'<div class="farr">&rsaquo;</div>'+step('Mockup',c.mockup)+'<div class="farr">&rsaquo;</div>'+step('Proposal',c.prop)+'<div class="farr">&rsaquo;</div>'+step('Closing',c.close)+'<div class="farr">&rsaquo;</div>'+step('Won',c.won)+'</div>';
}

// Build a Google Maps / search URL for a lead. Prefers the place_id (most
// accurate), falls back to a "business name + city" Google search so we
// always have a way to verify the listing.
function googleUrl(lead){
  if(lead.place_id){ return 'https://www.google.com/maps/place/?q=place_id:'+encodeURIComponent(lead.place_id); }
  var q = [lead.business_name, lead.city].filter(Boolean).join(' ').trim();
  if(!q) return null;
  return 'https://www.google.com/search?q='+encodeURIComponent(q);
}

// Build the chip row for the lead-detail header. Stage chip is always shown.
// Heat, score, Google rating, city and category chips appear when the field
// exists. The Google chip is a real <a> linking to Maps / search so Mike and
// Santi can verify what the AI is pulling about the business.
function detailChips(lead){
  var chips = [];
  var sk = stageKey(lead);
  chips.push('<span class="d-chip stage-'+sk+'">'+esc(stageLabel(lead))+'</span>');
  if(lead.heat){ chips.push('<span class="d-chip heat-'+esc(lead.heat)+'"><span class="d-ic">🌡</span>'+esc(lead.heat)+'</span>'); }
  if(lead.score != null){ chips.push('<span class="d-chip"><span class="d-ic">⭐</span>Score '+esc(lead.score)+'</span>'); }
  if(lead.rating != null){
    var gurl = googleUrl(lead);
    var reviewBit = (lead.review_count != null) ? ' ('+esc(lead.review_count)+')' : '';
    var inner = '<span class="d-ic">⭐</span>'+esc(lead.rating)+reviewBit+' Google';
    chips.push(gurl
      ? '<a class="d-chip" href="'+esc(gurl)+'" target="_blank" rel="noopener" title="Open Google listing">'+inner+'</a>'
      : '<span class="d-chip">'+inner+'</span>');
  } else if(googleUrl(lead)){
    // No rating on file but we can still link to Google for verification.
    chips.push('<a class="d-chip" href="'+esc(googleUrl(lead))+'" target="_blank" rel="noopener" title="Search on Google"><span class="d-ic">🔎</span>Google</a>');
  }
  if(lead.city){ chips.push('<span class="d-chip">'+esc(lead.city)+'</span>'); }
  if(lead.category){ chips.push('<span class="d-chip">'+esc(lead.category)+'</span>'); }
  var col = colOf(lead);
  var al = alertFor(lead, col);
  if(al){ chips.push('<span class="d-chip alert"><span class="d-ic">⚠</span>'+esc(al)+'</span>'); }
  return '<div class="d-chips">'+chips.join('')+'</div>';
}

  var wzB=bg.querySelector('[data-d="wizlink"]'); if(wzB) wzB.onclick=function(){bg.remove();sendWizardLink(lead);};

  var plB=bg.querySelector('[data-d="paylink"]'); if(plB) plB.onclick=function(){bg.remove();sendPaymentPage(lead);};
  var dpB=bg.querySelector('[data-d="deposit"]'); if(dpB) dpB.onclick=function(){bg.remove();sendPaymentPage(lead);};
  bg.querySelectorAll('[data-launch]').forEach(function(b){ b.onclick=async function(){
    var key=b.getAttribute('data-launch'); var done=b.getAttribute('data-done')==='1';
    b.disabled=true;
    try{ await api('/api/admin/cockpit/launch-step', {method:'POST', body: JSON.stringify({lead_id:lead.id, key:key, done:!done})}); await loadAll(); bg.remove(); openDetail(BY_ID[lead.id]||lead); }
    catch(err){ toast('Error: '+err.message, true); b.disabled=false; }
  }; });
  var lrB=bg.querySelector('[data-launchreview]'); if(lrB) lrB.onclick=function(){ bg.remove(); sendReviewRequest(lead); };
  var lmB=bg.querySelector('[data-launchmensual]'); if(lmB) lmB.onclick=function(){ bg.remove(); sendPlanLink(lead); };
  bg.querySelectorAll('[data-actdel]').forEach(function(b){ b.onclick=async function(){
    var aid=b.getAttribute('data-actdel');
    try{
      await api('/api/admin/crm/activities/'+aid, {method:'DELETE'});
      if(ACTS_BY_LEAD[lead.id]) ACTS_BY_LEAD[lead.id]=ACTS_BY_LEAD[lead.id].filter(function(x){return x.id!==aid;});
      var item=b.closest('.tl-item'); if(item) item.remove();
      toast('Removed');
    }catch(err){ toast('Error: '+err.message, true); }
  }; });
  // Manual image upload zone · drag-drop or click-to-browse. Each file is
  // POSTed as raw bytes with the appropriate Content-Type. The backend
  // patches mockup_data.images.gallery so the carousel + future regenerations
  // pick it up automatically.
  (function(){
    var box  = bg.querySelector('[data-d="upbox"]');
    if(!box) return;
    var drop = box.querySelector('[data-d="updrop"]');
    var inp  = box.querySelector('[data-d="upinput"]');
    var grid = box.querySelector('[data-d="upgrid"]');
    var cnt  = box.querySelector('[data-d="upcount"]');
    function setCount(n){ cnt.textContent = n ? n+' uploaded' : ''; }

    function thumbHTML(u){
      // u.src looks like '/mockup-img/<lead>/<slot>?v=...'; pull out the slot.
      var src = u.src || '';
      var m = src.match(/\/mockup-img\/[\w-]+\/([\w-]+)/);
      var slot = m ? m[1] : '';
      return '<div class="upthumb" style="background-image:url(\''+esc(src)+'\')" data-slot="'+esc(slot)+'">'
        + (slot ? '<button class="upx" data-slot="'+esc(slot)+'" title="Remove">×</button>' : '')
        + '</div>';
    }
    function renderThumbs(arr){
      grid.innerHTML = (arr || []).map(thumbHTML).join('');
      setCount((arr || []).length);
      grid.querySelectorAll('.upx').forEach(function(b){
        b.onclick = async function(e){
          e.preventDefault(); e.stopPropagation();
          var slot = b.getAttribute('data-slot'); if(!slot) return;
          if(!confirm('Remove this image?')) return;
          try{ await api('/api/admin/cockpit/mockup-upload/'+lead.id+'/'+slot, {method:'DELETE'}); toast('Image removed'); await refresh(); }
          catch(err){ toast('Error: '+err.message, true); }
        };
      });
    }
    async function refresh(){
      try{ var r = await api('/api/admin/cockpit/mockup-uploads/'+lead.id); renderThumbs(r && r.uploads || []); }
      catch(err){ /* leave grid empty */ }
    }
    async function uploadOne(file){
      if(!file || !file.type || file.type.indexOf('image/') !== 0){ toast('Not an image', true); return; }
      if(file.size > 8 * 1024 * 1024){ toast('Too large (max 8MB)', true); return; }
      toast('Uploading '+file.name+'...');
      try{
        var r = await fetch('/api/admin/cockpit/mockup-upload/'+lead.id, {
          method: 'POST',
          credentials: 'same-origin',
          headers: {'Content-Type': file.type},
          body: await file.arrayBuffer(),
        });
        var data = {}; try{ data = await r.json(); }catch(e){}
        if(!r.ok || !data.ok){ throw new Error(data.error || 'HTTP '+r.status); }
        toast('Uploaded');
      }catch(err){ toast('Upload failed: '+err.message, true); }
    }
    async function uploadMany(files){
      for(var i=0; i<files.length; i++) await uploadOne(files[i]);
      await refresh();
    }
    drop.addEventListener('click', function(e){ if(e.target.tagName !== 'INPUT'){ inp.click(); } });
    inp.addEventListener('change', function(){ if(inp.files && inp.files.length) uploadMany(inp.files); inp.value = ''; });
    drop.addEventListener('dragover', function(e){ e.preventDefault(); drop.classList.add('dragover'); });
    drop.addEventListener('dragleave', function(e){ if(e.target === drop) drop.classList.remove('dragover'); });
    drop.addEventListener('drop', function(e){
      e.preventDefault(); drop.classList.remove('dragover');
      var f = e.dataTransfer && e.dataTransfer.files; if(f && f.length) uploadMany(f);
    });
    refresh();
  })();
  // Mockup v2 · long-running build (scrape + Claude + image bank).
  // Fires the build, flips the card to `generating` state immediately, and
  // re-loads the grid when the endpoint returns (1-3 minutes typical).
  var mbB = bg.querySelector('[data-d="mockbuild"]');
  if(mbB) mbB.onclick = async function(){
    this.disabled = true; this.textContent = 'Building... (1-3 min)';
    lead.mockup_status = 'generating'; render(); // flip the card visual right away
    var regen = lead.mockup_status === 'ready' || lead.mockup_status === 'needs_review';
    try{
      var r = await api('/api/admin/cockpit/mockup-build/'+lead.id, {method:'POST', body: JSON.stringify({regenerate: regen})});
      if(r && r.status === 'ready')        toast('Mockup ready');
      else if(r && r.status === 'needs_review') toast('Built · needs review (thin data)', true);
      else if(r && r.status === 'error')   toast('Build error: '+(r.diagnostics && r.diagnostics.copy_error || 'unknown'), true);
      else                                  toast('Build returned: '+(r && r.status || 'unknown'));
    }catch(err){ toast('Error: '+err.message, true); }
    bg.remove(); loadAll();
  };
  var cmB=bg.querySelector('[data-d="copymock"]'); if(cmB) cmB.onclick=function(){ try{ navigator.clipboard.writeText(murl); toast('Link copied'); }catch(e){ toast('Copy manually', true); } };
  bg.querySelectorAll('[data-lang]').forEach(function(b){ b.onclick=async function(){
    var v=b.getAttribute('data-lang'); if((lead.demo_lang||'es')===v) return;
    try{ await api('/api/admin/crm/leads/'+lead.id, {method:'PATCH', body: JSON.stringify({demo_lang:v})}); lead.demo_lang=v; toast('Mockup version: '+(v==='en'?'English':'Local')); bg.remove(); openDetail(lead); }
    catch(err){ toast('Error: '+err.message, true); }
  }; });
  // Stage / Won / Lost buttons intentionally removed from the modal (2026-05-27).
  // Stage changes happen via kanban drag-and-drop only.
}

function mockClass(l){
  if(l.mockup_status==='generating') return 'mock-generating';

  if(l.mockup_status==='needs_review') return 'mock-review';
  return '';
}
function mockChip(l){
  if(l.mockup_status==='generating') return '<span class="chip mock-generating">⏳ Building mockup</span>';
  if(l.mockup_status==='ready')      return '<span class="chip mock-ready">✓ Mockup ready</span>';
  if(l.mockup_status==='needs_review') return '<span class="chip mock-review">⚠ Review mockup</span>';
  return '';
}

// decorative only. Unassigned leads get a muted dashed "Unassigned" badge.

  if(!first){
    return '<span class="owner-badge unassigned" title="Unassigned"><span class="ob-ini">?</span><span class="ob-name">Unassigned</span></span>';
  }

// Stage name for the card. The lead also lives in a column for this stage, but
// Mike wants it spelled out on the card too. Quiet neutral chip.
function stageTag(l, col){
  var map = {contact:'To contact', followup:'Follow-up', mockup:'Mockup', proposal:'Proposal', close:'Closing'};
  var label = map[col];
  return label ? '<span class="tag">'+esc(label)+'</span>' : '';
}

function cardHTML(l, col){
  // Clean, scannable card: company name, then a tidy chip row (stage / status +
  // heat), then category and city, then the next step. Owner badge sits top-
  // right. Even vertical spacing comes from the card's flex gap, not ad-hoc
  // margins, so nothing reads jumbled. Every coloured chip carries a text label
  // (colour is never the only signal · colour-blind safe).
  var viewed = col!=='closed' && viewedMockup(l);
  var mockCls = mockClass(l);
  var mockC = mockChip(l);
  var statusChip = '';
  if(col==='closed'){ statusChip = isWon(l) ? '<span class="chip won">✓ Won</span>' : '<span class="chip lost">✕ Lost</span>'; }
  else if(viewed){ statusChip = '<span class="chip view">Viewed mockup</span>'; }
  else if(mockC){ statusChip = mockC; }

  // Tag row: the deal status if there is one, otherwise the stage name; then heat.
  var tags = [];
  if(statusChip) tags.push(statusChip);
  else { var st = stageTag(l, col); if(st) tags.push(st); }
  if(col!=='closed' && l.heat) tags.push('<span class="pill '+esc(l.heat)+'">'+esc(l.heat)+'</span>');
  if(l.paid_at){ var lc=launchCounts(l); tags.push(lc.done<lc.total
    ? '<span class="pill" title="Pasos de lanzamiento pendientes">⏳ Lanzar '+lc.done+'/'+lc.total+'</span>'
    : '<span class="pill" title="Todos los pasos hechos">✔ En vivo</span>'); }

  var meta = [l.category, l.city].filter(Boolean).map(esc).join(' · ');
  var t = l.touches_count||0;
  var mini = (col==='closed') ? touchLine(l) : nextStep(l)+(t?' · '+t+' touch'+(t===1?'':'es'):'');
  // Border classes only where a visible chip accompanies them.
  var cls = viewed ? ' viewed' : (mockCls ? (' ' + mockCls) : '');
  return '<div class="card'+cls+'" draggable="true" data-id="'+esc(l.id)+'">'
    + '<button class="card-del" title="Delete permanently" data-del="'+esc(l.id)+'" aria-label="Delete">×</button>'
    + ownerBadge(l)
    + '<div class="biz">'+esc(leadName(l))+'</div>'
    + (tags.length?'<div class="card-tags">'+tags.join('')+'</div>':'')
    + (meta?'<div class="meta">'+esc(meta)+'</div>':'')
    + (mini?'<div class="cmini">'+esc(mini)+'</div>':'')
    + '</div>';
}

function colHTML(title, sub, items, col){
  var body = items.length ? items.map(function(l){return cardHTML(l,col);}).join('') : '<div class="empty">Nothing yet.</div>';
  var drop = (col==='contact'||col==='nonum') ? '' : ' data-drop="'+col+'"';
  return '<div class="col"'+drop+'><h2>'+esc(title)+' <span class="count">'+items.length+'</span></h2><div class="sub">'+esc(sub)+'</div>'+body+'</div>';
}

function render(){
  recomputeDue();
  var byScore = function(a,b){return (b.score||0)-(a.score||0);};
  var byNew = function(a,b){ var d=(b.created_at||0)-(a.created_at||0); return d || (b.score||0)-(a.score||0); };
  var byHot = function(col){ return function(a,b){ var av=viewedMockup(a)?1:0, bv=viewedMockup(b)?1:0; if(av!==bv) return bv-av; var aa=alertFor(a,col)?1:0, ba=alertFor(b,col)?1:0; if(aa!==ba) return ba-aa; return (b.score||0)-(a.score||0); }; };
  var L = (SEARCH || OWNER_FILTER) ? LEADS.filter(function(l){ return matchSearch(l) && matchOwner(l); }) : LEADS;
  var contact  = L.filter(inContact).sort(byNew);
  var sinNum   = L.filter(inNoNum).sort(byNew);
  var follow   = L.filter(inFollow).sort(byHot('followup'));
  var mockup   = L.filter(inMockup).sort(byHot('mockup'));
  var proposal = L.filter(inProposal).sort(byHot('proposal'));
  var close    = L.filter(inClose).sort(byHot('close'));
  var closed   = L.filter(function(l){return isWon(l)||isLost(l);}).sort(function(a,b){return (b.last_touched_at||0)-(a.last_touched_at||0);});
  var openedN  = LEADS.filter(function(l){return mockOpened(l) && isActive(l);}).length;
  var html = '';
  if(openedN) html += '<div class="alert"><span><b>'+openedN+'</b> '+(openedN===1?'prospect viewed':'prospects viewed')+' your mockup. Message them now, they\'re warm.</span></div>';
  html += funnelStripHTML()
    + '<div class="cols">'
    + colHTML('To contact', 'Have WhatsApp. Ready to message.', contact, 'contact')
    + colHTML('Follow-up', 'You already messaged. Red = time to push.', follow, 'followup')
    + colHTML('Mockup', 'Send them the personalized example.', mockup, 'mockup')
    + colHTML('Pago', 'Envía el acuerdo y el pago.', proposal, 'proposal')
    + colHTML('Closing', 'Proposal sent. Close the deal.', close, 'close')
    + colHTML('Closed', 'Won and lost.', closed, 'closed')
    + '</div>';
  if(sinNum.length) html += noNumSectionHTML(sinNum);
  document.getElementById('app').innerHTML = html;
  wireDrag();
}

// HTML5 drag-and-drop does NOT auto-scroll the window when the cursor nears
// the edge of the viewport · this leaves you stuck if the target column is
// scrolled offscreen. Listen for dragover at window level and scroll up /
// down at a speed proportional to how close to the edge the cursor is.
var __autoScrollDelta = 0, __autoScrollRaf = null;
function __autoScrollTick(){
  if(!__autoScrollDelta){ __autoScrollRaf = null; return; }
  window.scrollBy(0, __autoScrollDelta);
  __autoScrollRaf = requestAnimationFrame(__autoScrollTick);
}
function __onDragOverWindow(e){
  var y = e.clientY, h = window.innerHeight, ZONE = 90, MAX_SPEED = 20;
  if(y < ZONE)              __autoScrollDelta = -Math.round(MAX_SPEED * (1 - y / ZONE));
  else if(y > h - ZONE)     __autoScrollDelta =  Math.round(MAX_SPEED * (1 - (h - y) / ZONE));
  else                      __autoScrollDelta = 0;
  if(__autoScrollDelta && !__autoScrollRaf){ __autoScrollRaf = requestAnimationFrame(__autoScrollTick); }
}
function __startAutoScroll(){ window.addEventListener('dragover', __onDragOverWindow); }
function __stopAutoScroll(){
  window.removeEventListener('dragover', __onDragOverWindow);
  __autoScrollDelta = 0;
  if(__autoScrollRaf){ cancelAnimationFrame(__autoScrollRaf); __autoScrollRaf = null; }
}

function wireDrag(){
  var app = document.getElementById('app');
  app.querySelectorAll('.card[draggable=true]').forEach(function(card){
    card.addEventListener('dragstart', function(e){ window.__drag = card.getAttribute('data-id'); card.classList.add('dragging'); __startAutoScroll(); try{ e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain', window.__drag); }catch(_){} });
    card.addEventListener('dragend', function(){ card.classList.remove('dragging'); window.__drag=null; __stopAutoScroll(); });
  });
  app.querySelectorAll('.col[data-drop]').forEach(function(col){
    col.addEventListener('dragover', function(e){ e.preventDefault(); col.classList.add('drop-hot'); try{ e.dataTransfer.dropEffect='move'; }catch(_){} });
    col.addEventListener('dragleave', function(e){ if(e.target===col) col.classList.remove('drop-hot'); });
    col.addEventListener('drop', function(e){ e.preventDefault(); col.classList.remove('drop-hot'); var id=window.__drag||(e.dataTransfer&&e.dataTransfer.getData('text/plain')); if(id) moveTo(id, col.getAttribute('data-drop')); });
  });
  // Hard-delete buttons on each card (× top-right). Confirm before firing.
  // Stops propagation so the click doesn't open the card panel.
  app.querySelectorAll('[data-del]').forEach(function(btn){
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      e.preventDefault();
      var id = btn.getAttribute('data-del');
      var lead = BY_ID[id];
      var name = lead ? leadName(lead) : 'this prospect';
      if(!confirm('Permanently delete "' + name + '"?\n\nThis removes the card, its activities, and its proposal. If the client already paid, payments are preserved. Cannot be undone.')) return;
      btn.disabled = true;
      api('/api/admin/crm/leads/' + id, { method: 'DELETE' })
        .then(function(){ toast('Deleted'); loadAll(); })
        .catch(function(err){ toast('Error: ' + (err && err.message || err), true); btn.disabled = false; });
    });
  });
}

// ---- actions (event delegation) ----
document.getElementById('app').addEventListener('click', function(e){
  var btn = e.target.closest('button[data-a]');
  if(btn){
    var c = e.target.closest('[data-id]'); var bid = c && c.getAttribute('data-id'); if(!bid) return;
    var bl = BY_ID[bid]; if(!bl) return;
    var a = btn.getAttribute('data-a');
    if(a==='msg') aiDraft(bl, btn.getAttribute('data-mode'));
    else if(a==='warm') setStage(bl, 'sales_qualified', 'Marked as interested');
    else if(a==='drop') setStage(bl, 'disqualified', 'Discarded');
    else if(a==='won') setStage(bl, 'sales_qualified', 'Marked as won', 'won');
    else if(a==='call') bookCall(bl);
    else if(a==='mockup') sendMockup(bl);
    else if(a==='addnum') addNumber(bl);
    else if(a==='detail') openDetail(bl);
    return;
  }
  // Click anywhere on a card opens its detail panel.
  var card = e.target.closest('.card[data-id]');
  if(card){ var lead = BY_ID[card.getAttribute('data-id')]; if(lead) openDetail(lead); }
});

}

// ---- Team stats view ----
// "Responded" = the prospect actually wrote back. Driven by the explicit
// `client_replied_at` marker a rep sets via "Mark client replied" on the lead
// card (added 0014_client_replied.sql). This replaced the old heat/stage proxy,
// which over-counted: heat (HOT/WARM) is a manual tag a rep can set without any
// reply having happened, so a rep who tagged every lead WARM showed 100%
// "responded" with zero real replies.
function teamResponded(l){
  return !!l.client_replied_at;
}
function _teamOwnerKey(l){ var k=_ownerKey(l.owner); return (k && k!=='system' && k!=='ai') ? k : ''; }
function teamRows(){
  // Seed with the full active roster so nobody is hidden, then add any other
  // handle that actually owns a lead, plus a final null-owner "Unassigned"
  // bucket.
  var stat = {};
  function ensure(k){ if(!stat[k]){ stat[k] = {key:k, owned:0, touch:0, responded:0, mockup:0, sold:0}; } return stat[k]; }
  ROSTER.filter(function(r){ return r.active; }).forEach(function(r){ ensure(r.handle); });
  var unassigned = {key:'__none__', owned:0, touch:0, responded:0, mockup:0, sold:0};
  LEADS.forEach(function(l){
    var k = _teamOwnerKey(l);
    var row = k ? ensure(k) : unassigned;
    row.owned++;
    row.touch += (l.touches_count||0);
    if(teamResponded(l)) row.responded++;
    if(inMockup(l)) row.mockup++;
    if(isWon(l)) row.sold++;
  });
  var rows = Object.keys(stat).map(function(k){ return stat[k]; });
  // Sort: Sold desc, then Leads actioned desc, then name for stability.
  rows.sort(function(a,b){
    if(b.sold!==a.sold) return b.sold-a.sold;
    if(b.owned!==a.owned) return b.owned-a.owned;
    return salesName(a.key).localeCompare(salesName(b.key));
  });
  if(unassigned.owned) rows.push(unassigned);
  return rows;
}
function teamTableHTML(){
  var rows = teamRows();
  var adminCol = IS_ADMIN;
  var body = rows.map(function(r){
    var isNone = r.key==='__none__';
    var name = isNone ? 'Unassigned' : salesName(r.key);
    var avg = r.owned ? (r.touch / r.owned).toFixed(1) : '0.0';
    var pct = r.owned ? Math.round(r.responded / r.owned * 100) : 0;
    var editCell = '';
    if(adminCol){
      // Only roster rows (not the Unassigned bucket, not legacy handles missing
      // from the roster) get an Edit button.
      editCell = (!isNone && ROSTER_BY[r.key])
        ? '<td class="team-edit-cell"><button class="team-edit-btn" data-edit="'+esc(r.key)+'">Edit</button></td>'
        : '<td class="team-edit-cell"></td>';
    }
    return '<tr'+(isNone?' class="team-unassigned"':'')+'>'
      + '<td>'+esc(name)+'</td>'
      + '<td><span class="team-num">'+r.owned+'</span></td>'
      + '<td><span class="team-num">'+avg+'</span></td>'
      + '<td><span class="team-num">'+r.responded+'</span><span class="team-pct">'+pct+'% of actioned</span></td>'
      + '<td><span class="team-num">'+r.mockup+'</span></td>'
      + '<td><span class="team-num">'+r.sold+'</span></td>'
      + editCell
      + '</tr>';
  }).join('');
  var addBtn = adminCol
    ? '<button class="team-add" id="team-add">+ Add salesperson</button>'
    : '';
  return '<div class="team-head">'
    + '<button class="team-back" id="team-back"><span class="tb-ic">&larr;</span>Back to board</button>'
    + '<h2>Team stats</h2>'
    + '<span class="team-head-spacer"></span>'
    + addBtn
    + '</div>'
    + '<p class="team-sub">One row per salesperson. Computed from the leads currently loaded on this board.</p>'
    + '<div id="team-form-slot"></div>'
    + '<div class="team-wrap"><table class="team-tbl">'
    + '<thead><tr>'
    + '<th>Salesperson</th><th>Leads actioned</th><th>Avg actions / lead</th>'
    + '<th>Responded</th><th>At mockup stage</th><th>Sold</th>'
    + (adminCol ? '<th></th>' : '')
    + '</tr></thead>'
    + '<tbody>'+body+'</tbody></table>'
    + '<p class="team-foot">Sorted by Sold, then Leads actioned. <b>Responded</b> counts a prospect only once a rep has marked that the client actually wrote back (the "Mark client replied" button on the lead card). It is no longer inferred from heat or stage, so the number reflects real replies, not warm tags.</p>'
    + '</div>';
}

// Admin form: add a new salesperson, or edit an existing one (handle present).
// Rendered into #team-form-slot above the table.
function salespersonFormHTML(handle){
  var editing = handle && ROSTER_BY[handle];
  var row = editing ? ROSTER_BY[handle] : null;
  var title = editing ? ('Edit '+esc(row.full_name||handle)) : 'Add salesperson';
  var nameVal = editing ? esc(row.full_name||'') : '';
  var emailsVal = editing ? esc(row.emails||'') : '';
  var roleVal = editing ? (row.role||'seller') : 'seller';
  var activeChecked = editing ? (row.active ? ' checked' : '') : ' checked';
  var nameField = editing
    // handle is the stable key on leads.owner, so the name stays editable but
    // the handle is shown read-only for context.
    ? '<div class="tf-field"><label>Full name</label><input type="text" id="tf-name" value="'+nameVal+'"></div>'
      + '<div class="tf-field"><label>Handle (fixed)</label><input type="text" value="'+esc(handle)+'" disabled></div>'
    : '<div class="tf-field"><label>Full name <span class="tf-req">required</span></label><input type="text" id="tf-name" value="'+nameVal+'" placeholder="e.g. Cristian Ariza"></div>';
  return '<div class="team-form" role="group" aria-label="'+(editing?'Edit salesperson':'Add salesperson')+'">'
    + '<div class="tf-head">'+title+'</div>'
    + nameField
    + '<div class="tf-field"><label>Login email(s), comma-separated</label><input type="text" id="tf-emails" value="'+emailsVal+'" placeholder="name@example.com, alt@example.com"></div>'
    + '<div class="tf-field"><label>Role</label><select id="tf-role">'
    + '<option value="seller"'+(roleVal==='seller'?' selected':'')+'>Seller</option>'
    + '<option value="admin"'+(roleVal==='admin'?' selected':'')+'>Admin</option>'
    + '</select></div>'
    + (editing ? '<div class="tf-field tf-active"><label><input type="checkbox" id="tf-active"'+activeChecked+'> Active</label></div>' : '')
    + '<p class="tf-note">Also add each login email to the Cloudflare Access policy for ventas.pymewebpro.com, or they cannot log in.</p>'
    + '<div class="tf-actions">'
    + '<button class="tf-save" id="tf-save">'+(editing?'Save changes':'Add')+'</button>'
    + '<button class="tf-cancel" id="tf-cancel">Cancel</button>'
    + '</div>'
    + '</div>';
}

function openSalespersonForm(handle){
  var slot = document.getElementById('team-form-slot');
  if(!slot) return;
  slot.innerHTML = salespersonFormHTML(handle);
  var nameEl = document.getElementById('tf-name');
  if(nameEl) nameEl.focus();
  var saveBtn = document.getElementById('tf-save');
  var cancelBtn = document.getElementById('tf-cancel');
  if(cancelBtn) cancelBtn.addEventListener('click', function(){ slot.innerHTML=''; });
  if(saveBtn) saveBtn.addEventListener('click', function(){ submitSalesperson(handle); });
}

async function submitSalesperson(handle){
  var editing = !!(handle && ROSTER_BY[handle]);
  var nameEl = document.getElementById('tf-name');
  var emailsEl = document.getElementById('tf-emails');
  var roleEl = document.getElementById('tf-role');
  var activeEl = document.getElementById('tf-active');
  var fullName = nameEl ? nameEl.value.trim() : '';
  if(!editing && !fullName){ toast('Full name is required', true); return; }
  var payload = { emails: emailsEl ? emailsEl.value : '', role: roleEl ? roleEl.value : 'seller' };
  if(fullName) payload.full_name = fullName;
  if(editing && activeEl) payload.active = activeEl.checked;
  var saveBtn = document.getElementById('tf-save');
  if(saveBtn){ saveBtn.disabled = true; saveBtn.textContent = 'Saving...'; }
  try {
    if(editing){
      await api('/api/admin/crm/salespeople/'+encodeURIComponent(handle), {method:'PATCH', body: JSON.stringify(payload)});
      toast('Salesperson updated');
    } else {
      await api('/api/admin/crm/salespeople', {method:'POST', body: JSON.stringify(payload)});
      toast('Salesperson added');
    }
    await loadRoster();
    var ov = document.getElementById('team-overlay');
    ov.innerHTML = teamTableHTML();
    wireTeamControls();
  } catch(e){
    toast('Error: '+(e && e.message || e), true);
    if(saveBtn){ saveBtn.disabled = false; saveBtn.textContent = editing ? 'Save changes' : 'Add'; }
  }
}

function wireTeamControls(){
  var back = document.getElementById('team-back');
  if(back) back.addEventListener('click', hideTeam);
  var add = document.getElementById('team-add');
  if(add) add.addEventListener('click', function(){ openSalespersonForm(null); });
  var ov = document.getElementById('team-overlay');
  if(ov){
    ov.querySelectorAll('[data-edit]').forEach(function(btn){
      btn.addEventListener('click', function(){ openSalespersonForm(btn.getAttribute('data-edit')); });
    });
  }
}
function showTeam(){
  var ov = document.getElementById('team-overlay');
  ov.innerHTML = teamTableHTML();
  ov.hidden = false;
  document.body.style.overflow = 'hidden';
  wireTeamControls();
}
function hideTeam(){
  var ov = document.getElementById('team-overlay');
  ov.hidden = true;
  ov.innerHTML = '';
  document.body.style.overflow = '';
}
document.getElementById('btn-team').addEventListener('click', function(e){ e.preventDefault(); showTeam(); });
document.addEventListener('keydown', function(e){ if(e.key==='Escape'){ var ov=document.getElementById('team-overlay'); if(ov && !ov.hidden) hideTeam(); } });

loadAll();
</script>
</body>
</html>
